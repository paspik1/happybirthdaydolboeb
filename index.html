<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PASPIK TERMINAL</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;900&display=swap" rel="stylesheet">

<style>
    body.crt {
        margin: 0;
        background: black;
        color: #00ff6a;
        font-family: "Courier New", monospace;
        overflow-x: hidden;
    }

    /* Матрица */
    canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: -1;
    }

    /* Поле ввода */
    #pass {
        width: 100%;
        padding: 12px;
        font-size: 20px;
        background: #000;
        border: 2px solid #00ff6a;
        color: #00ff6a;
        border-radius: 6px;
        outline: none;
        caret-color: #00ff6a;
        box-shadow: 0 0 12px #00ff6a;
    }

    #pass:focus {
        box-shadow: 0 0 25px #00ff6a;
    }

    /* Праздничный режим */
    .party-mode {
        background: linear-gradient(135deg, #00ff6a, #00994a, #00ff6a);
        animation: party-bg 6s infinite alternate;
        color: white !important;
    }

    @keyframes party-bg {
        0% { filter: hue-rotate(0deg); }
        100% { filter: hue-rotate(360deg); }
    }

    .party-title {
        font-size: 60px;
        text-align: center;
        font-weight: 900;
        color: #ffffff;
        text-shadow: 0 0 25px #ffffff, 0 0 45px #00ff6a;
        animation: party-title-glow 2s infinite alternate;
    }

    @keyframes party-title-glow {
        from { opacity: 0.7; }
        to { opacity: 1; }
    }

    /* Сердечки */
    #hearts {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 5;
    }

    .heart {
        position: absolute;
        font-size: 24px;
        color: #00ff6a;
        animation: fall 3s linear forwards;
    }

    @keyframes fall {
        from { transform: translateY(-50px); opacity: 1; }
        to { transform: translateY(100vh); opacity: 0; }
    }

    /* Вспышка */
    #darken {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: black;
        opacity: 0;
        pointer-events: none;
        z-index: 3;
        transition: opacity 0.3s ease-in-out;
    }
</style>
</head>

<body class="crt">

<div id="darken"></div>

<canvas id="matrix"></canvas>

<div class="terminal">
    <h1 style="text-align:center;">Введите пароль:</h1>
    <input id="pass" type="text">
    <button onclick="check()">ПОДТВЕРДИТЬ</button>

    <div id="scan"></div>
    <div id="hints"></div>
    <div id="hack"></div>
</div>

<div id="party" style="display:none;">
    <h1 class="party-title">С ДНЁМ РОЖДЕНИЯ!!! 🎉💚</h1>
</div>

<div id="hearts"></div>

<script src="https://www.youtube.com/iframe_api"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>
/* Матрица */
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const letters = "01";
const fontSize = 16;
const columns = canvas.width / fontSize;
const drops = [];
for (let i = 0; i < columns; i++) drops[i] = 1;

function drawMatrix() {
    ctx.fillStyle = "rgba(0, 0, 0, 0.08)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#00ff6a";
    ctx.font = fontSize + "px monospace";

    for (let i = 0; i < drops.length; i++) {
        const text = letters[Math.floor(Math.random() * letters.length)];
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);

        if (drops[i] * fontSize > canvas.height && Math.random() > 0.95)
            drops[i] = 0;

        drops[i]++;
    }
}
setInterval(drawMatrix, 40);

/* Сердечки */
function spawnHeart() {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "💚";
    heart.style.left = Math.random() * 100 + "vw";
    document.getElementById("hearts").appendChild(heart);
    setTimeout(() => heart.remove(), 3000);
}

/* YouTube */
let player;
let wrongPlayer;

function onYouTubeIframeAPIReady() {

    // Музыка правильного пароля
    player = new YT.Player('ytplayer', {
        height: '0',
        width: '0',
        videoId: 'K_F74VX7X8s',
        playerVars: { autoplay: 0, controls: 0, rel: 0, modestbranding: 1 },
        events: { onReady: e => player.setVolume(100) }
    });

    // Музыка неверного пароля
    wrongPlayer = new YT.Player('ytplayer_wrong', {
        height: '0',
        width: '0',
        videoId: '6GY9kfXvr_c',
        playerVars: { autoplay: 0, controls: 0, rel: 0, modestbranding: 1 },
        events: { onReady: e => wrongPlayer.setVolume(100) }
    });
}

/* Проверка пароля */
function check() {
    const p = document.getElementById("pass").value;

    if (p === "22.08.2009") {

        try { wrongPlayer.stopVideo(); } catch(e) {}
        try { player.playVideo(); player.setVolume(100); } catch(e) {}

        document.querySelector(".terminal").style.display = "none";
        document.getElementById("matrix").style.display = "none";

        document.body.classList.add("party-mode");
        document.getElementById("party").style.display = "block";

        confetti({ particleCount: 300, spread: 150 });

        for (let h = 0; h < 20; h++) {
            setTimeout(spawnHeart, h * 150);
        }

    } else {
        try { player.stopVideo(); } catch(e) {}
        try { wrongPlayer.playVideo(); wrongPlayer.setVolume(100); } catch(e) {}

        const dark = document.getElementById("darken");
        dark.style.opacity = "0.3";
        setTimeout(() => dark.style.opacity = "0", 300);
    }
}
</script>

<div id="ytplayer"></div>
<div id="ytplayer_wrong"></div>

</body>
</html>
