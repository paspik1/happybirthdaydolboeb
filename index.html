<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Терминал</title>

<style>
    body {
        margin: 0;
        background: black;
        color: #00ff6a;
        font-family: "Courier New", monospace;
        overflow: hidden;
    }

    /* Матрица фон */
    canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: -1;
    }

    .terminal {
        padding: 20px;
        position: relative;
        z-index: 10;
    }

    h1 {
        text-align: center;
        font-size: 24px;
        text-shadow: 0 0 10px #00ff6a;
    }

    input, button {
        width: 100%;
        padding: 12px;
        font-size: 20px;
        border-radius: 6px;
        margin-top: 10px;
    }

    input {
        background: #000;
        border: 2px solid #00ff6a;
        color: #00ff6a;
    }

    button {
        background: #00ff6a;
        border: none;
        color: #000;
        font-weight: bold;
    }

    #hack {
        margin-top: 25px;
        font-size: 18px;
        white-space: pre;
        display: none;
    }

    #cat {
        margin-top: 20px;
        font-size: 20px;
        display: none;
        text-align: center;
    }
</style>
</head>
<body>

<canvas id="matrix"></canvas>

<div class="terminal">
    <h1>
    ПАРОЛЬ ОТ НОВОТРОИЦКОГО РЭСА<br>
    <span style="font-size:18px; color:#00ff6a; text-shadow:0 0 10px #00ff6a;">
        (от сердца Владислава Кузьменка ❤️)
    </span>
</h1>

    <p>Введите пароль:</p>
    <input id="pass" type="text" placeholder="дд.мм.гггг">
    <button onclick="check()">ПОДТВЕРДИТЬ</button>

    <div id="hack"></div>
    <div id="cat"></div>
</div>

<!-- Конфетти библиотека -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>
/* Матрица фон */
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const letters = "01";
const fontSize = 16;
const columns = canvas.width / fontSize;

const drops = [];
for (let i = 0; i < columns; i++) drops[i] = 1;

function drawMatrix() {
    ctx.fillStyle = "rgba(0, 0, 0, 0.08)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#00ff6a";
    ctx.font = fontSize + "px monospace";

    for (let i = 0; i < drops.length; i++) {
        const text = letters[Math.floor(Math.random() * letters.length)];
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);

        if (drops[i] * fontSize > canvas.height && Math.random() > 0.95)
            drops[i] = 0;

        drops[i]++;
    }
}

setInterval(drawMatrix, 40);

/* Логика пароля */
function check() {
    const p = document.getElementById("pass").value;
    const hack = document.getElementById("hack");
    const cat = document.getElementById("cat");

    if (p === "22.08.2009") {
        hack.style.display = "block";
        cat.style.display = "none";

        let i = 0;
        const interval = setInterval(() => {
            hack.textContent = "ВЗЛОМ СИСТЕМЫ: [" + "#".repeat(i) + " ".repeat(30 - i) + "]";
            i++;
            if (i > 30) {
                clearInterval(interval);
                hack.textContent = "ДОСТУП ПОЛУЧЕН!\n";

                // Конфетти взрыв
                confetti({
                    particleCount: 200,
                    spread: 100,
                    origin: { y: 0.6 }
                });

                setTimeout(() => {
                    cat.style.display = "block";
                    cat.innerHTML = `
<pre>
   /\\_/\\
  ( o.o )
   > ^ <
</pre>
<p style="color:#00ff6a;">
С ДНЁМ РОЖДЕНИЯ, БРО! 🎉<br>
Система поздравляет тебя 😼
</p>
                    `;
                }, 400);
            }
        }, 50);

    } else {
        hack.style.display = "block";
        hack.textContent = "Неверный пароль. Доступ запрещён.";
        cat.style.display = "none";
    }
}
</script>

</body>
</html>
